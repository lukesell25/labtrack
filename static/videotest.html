<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LabTrack video isolation test</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #wrap { position: fixed; inset: 0; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* identical to .media__scrim in style.css */
  #scrim { position: absolute; inset: 0; background: rgba(14, 17, 22, 0.72); display: none; }
  body.scrim #scrim { display: block; }
  /* identical layering to the real slide sitting over the video */
  #text {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    font: 600 3.4rem system-ui, sans-serif; color: #eef1f4;
  }
  body.scrim #text { display: flex; }
  #hud {
    position: fixed; top: 0; left: 0; z-index: 9;
    background: #000; color: #0f0; padding: 10px 14px;
    font: 20px ui-monospace, monospace; white-space: pre;
  }
</style>
</head>
<body>
  <div id="wrap">
    <video id="v" autoplay muted playsinline loop></video>
    <div id="scrim"></div>
    <div id="text">Supporting ESCS Capstone Program</div>
  </div>
  <div id="hud">starting…</div>

<script>
// Isolation test for the background-video freeze on the Pi.
//   /static/videotest.html            video alone, nothing composited over it
//   /static/videotest.html?scrim=1    same video with the kiosk's scrim + text on top
//   /static/videotest.html?earlyloop=5 drop the loop attribute and seek back to 0
//                                     five seconds early, so end-of-stream is never
//                                     reached and the decoder is never drained
//   /static/videotest.html?noloop=1   drop the loop attribute, let it run to the end
// Everything else from the kiosk page (polling, roster, slide rotation,
// objectives) is deliberately absent, so a freeze here means the cause is
// the video path itself rather than anything the board does around it.
const params = new URLSearchParams(location.search);
const withScrim = params.has("scrim");
if (withScrim) document.body.classList.add("scrim");

const v = document.getElementById("v");
const hud = document.getElementById("hud");

// Seconds of headroom to leave before the end of the clip. The Pi's V4L2
// decoder wedges on the end-of-stream drain, so the point of this mode is to
// wrap around before Chromium ever asks it to drain.
const earlyLoop = params.has("earlyloop") ? parseFloat(params.get("earlyloop")) : 0;
if (earlyLoop || params.has("noloop")) v.removeAttribute("loop");

let loops = 0;
if (earlyLoop) {
  v.addEventListener("timeupdate", () => {
    if (v.duration && v.currentTime > v.duration - earlyLoop) {
      loops++;
      v.currentTime = 0;
    }
  });
}

v.src = "/static/media/" + (params.get("file") || "background.mp4");

const log = [];
for (const name of ["waiting", "stalled", "suspend", "playing", "error", "ended"]) {
  v.addEventListener(name, () => {
    log.unshift(v.currentTime.toFixed(2) + " " + name);
    log.length = Math.min(log.length, 5);
  });
}

let lastFrames = -1, stalledFor = 0, maxTime = 0;
setInterval(() => {
  const q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : null;
  const frames = q ? q.totalVideoFrames : -1;
  stalledFor = frames === lastFrames ? stalledFor + 1 : 0;
  lastFrames = frames;
  maxTime = Math.max(maxTime, v.currentTime);
  const buf = v.buffered.length ? v.buffered.end(v.buffered.length - 1) : 0;
  hud.textContent = [
    "mode     " + (withScrim ? "WITH scrim + text" : "video ALONE") +
      (earlyLoop ? "  earlyloop " + earlyLoop + "s" : "") +
      (params.has("noloop") ? "  NO loop" : ""),
    "wraps    " + loops,
    "t        " + v.currentTime.toFixed(2) + " / " + (v.duration || 0).toFixed(2),
    "furthest " + maxTime.toFixed(2),
    "frames   " + frames + "   dropped " + (q ? q.droppedVideoFrames : "?"),
    "stalled  " + stalledFor + "s",
    "ready    " + v.readyState + "   net " + v.networkState,
    "buffered " + buf.toFixed(1) +
      (v.duration && buf >= v.duration - 0.2 ? "  FULL" : "  partial"),
    "error    " + (v.error ? v.error.code : "-"),
    "events:",
    ...log.map(l => "  " + l),
  ].join("\n");
}, 1000);
</script>
</body>
</html>
