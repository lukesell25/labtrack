<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Falcon AI Research Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="kiosk">

  <main class="board">
    <header class="board__header">
      <div class="board__eyebrow">FALCON AI RESEARCH LAB</div>
      <div class="board__meta">
        <!-- Whether a card reader is actually attached. Sampled server-side
             (cac_reader.start_reader_watch) and delivered on /api/state; the
             starting text is the "not yet polled" state, replaced within a
             poll or two by renderReader(). -->
        <div class="board__reader" id="reader-status">Reader</div>
        <div class="board__clock" id="clock">--:--:--</div>
      </div>
    </header>

    <section class="media" id="media">
      <!-- Looping background behind every slide. No "loop" attribute: main.js
           wraps back to the start early instead, because reaching end-of-stream
           permanently wedges the Pi's hardware decoder (see LOOP_TAIL_S).
           It stays hidden until main.js confirms a file is configured.

           data-video is chosen server-side (BACKGROUND_VIDEO_CANDIDATES in
           app.py), not named in main.js, because which file exists depends on
           whether scripts/build-loop.sh has run on this machine. Empty means
           no background. -->
      <video class="media__bg" id="media-bg" autoplay muted playsinline
             data-video="{{ background_video }}"></video>
      <div class="media__scrim"></div>
      <!-- Panel header, deliberately a sibling of the slide rather than a
           child of it: inside .slide__body it moved with the layout (centred
           on text-only slides, shoved right on has-image ones). Out here it's
           pinned to the panel, so it holds still across the whole rotation.
           main.js hides it with the slide when there's nothing to show. -->
      <div class="media__label" id="media-label">What is FAIR working on?</div>
      <div class="slide" id="media-slide">
        <img class="slide__image" id="slide-image" alt="" decoding="async">
        <div class="slide__body">
          <div class="slide__text" id="slide-text"></div>
        </div>
      </div>
      <div class="media__empty" id="media-empty">
        Add objectives to <code>config/objectives.json</code> to cycle them here.
      </div>
    </section>
  </main>

  <footer class="roster" id="roster">
    <!-- populated by JS -->
  </footer>

  <div class="reading-overlay" id="reading-overlay">
    <div class="reading-overlay__dot"></div>
    <div class="reading-overlay__text">Reading card&hellip;</div>
  </div>

  <!-- The leaving / check-in dialog. Two things open it: clicking a name on
       the roster strip (no card - the board asks first, because the strip
       sits under the mouse pointer all day and a stray click must not
       silently log somebody in or out), and a card tap by someone who is
       already in, which is ambiguous - going home, or to the server room? -
       and is not written until they say (or 20s pass, which records a
       checkout). main.js shows and hides the buttons per state; the away row
       lists the presets from config/locations.json. -->
  <div class="confirm" id="confirm">
    <div class="confirm__name" id="confirm-name"></div>
    <div class="confirm__action" id="confirm-action"></div>
    <div class="confirm__hint" id="confirm-hint"></div>
    <div class="confirm__actions">
      <button type="button" id="confirm-cancel" class="confirm__btn">Cancel</button>
      <button type="button" id="confirm-in" class="confirm__btn confirm__btn--in" data-action="in">Check in</button>
      <button type="button" id="confirm-out" class="confirm__btn confirm__btn--out" data-action="out">Check out</button>
    </div>
    <div class="confirm__away" id="confirm-away">
      <div class="confirm__away-label">Still at work, elsewhere:</div>
      <div class="confirm__actions confirm__locations" id="confirm-locations">
        <!-- preset buttons, populated by main.js -->
      </div>
      <form class="confirm__other" id="confirm-other">
        <input type="text" id="confirm-other-input" class="confirm__input"
               placeholder="Where?" maxlength="80" autocomplete="off">
        <button type="submit" id="confirm-other-go" class="confirm__btn confirm__btn--away">Go</button>
      </form>
    </div>
  </div>

  <!-- Reboot notice. The board can reach a state only a reboot clears - a
       wedged video decoder takes the display down while the page itself keeps
       running - so the server schedules one and this says so first. Above
       every other overlay in the stack: whatever else is on screen, the
       screen going away shortly is the more important thing to say. -->
  <div class="reboot" id="reboot">
    <div class="reboot__title">Display fault</div>
    <div class="reboot__count" id="reboot-count"></div>
    <div class="reboot__hint">Restarting to recover. Check-ins resume automatically.</div>
  </div>

  <div class="toast" id="toast">
    <div class="toast__name" id="toast-name"></div>
    <div class="toast__action" id="toast-action"></div>
    <!-- Text set by main.js: removing your card is the wrong instruction when
         nobody used one. -->
    <div class="toast__hint" id="toast-hint">You may remove your card now</div>
    <div class="toast__note" id="toast-note">
      <input type="text" id="note-input" class="toast__note-input"
             placeholder="Add a note (optional) — e.g. at lunch, back at 14:00" maxlength="80" autocomplete="off">
      <div class="toast__note-actions">
        <button type="button" id="note-skip" class="toast__note-btn">Skip</button>
        <button type="button" id="note-save" class="toast__note-btn toast__note-btn--save">Save</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
